name: Publish Windows Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version. Empty means read build/config.yml info.version."
        required: false
        default: ""
      release_tag:
        description: "Release tag to upload assets to, for example v1.1.0. Empty means v<version> for manual runs."
        required: false
        default: ""
      environment:
        description: "GitHub Environment for approvals and scoped PUBLIC_RELEASE_TOKEN/PUBLIC_RELEASE_REPOSITORY."
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - production
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Resolve version
        id: version
        run: |
          $inputVersion = "${{ inputs.version }}".Trim()
          $inputReleaseTag = "${{ inputs.release_tag }}".Trim()
          $releaseEventTag = "${{ github.event.release.tag_name }}".Trim()
          $refType = "${{ github.ref_type }}".Trim()
          $refName = "${{ github.ref_name }}".Trim()

          $tag = ""
          if ($releaseEventTag) {
            $tag = $releaseEventTag
          } elseif ($refType -eq "tag") {
            $tag = $refName
          } elseif ($inputReleaseTag) {
            $tag = $inputReleaseTag
          }

          if ($inputVersion) {
            $version = $inputVersion
          } elseif ($tag) {
            $version = $tag -replace '^[vV][\.\-_]*', ''
          } else {
            $buildConfigText = Get-Content -LiteralPath "build/config.yml" -Raw
            $match = [regex]::Match($buildConfigText, '(?m)^\s{2}version:\s*["'']?([^"''\r\n]+)')
            if (-not $match.Success) {
              throw "Cannot resolve info.version from build/config.yml"
            }
            $version = [string]$match.Groups[1].Value
          }

          $version = $version.Trim()
          if ($version -match '^0\.0\.0\.(\d+)$') {
            $version = "0.0.$([int]$Matches[1])"
          } elseif ($version -match '^0\.(\d)(\d)$') {
            $version = "0.$($Matches[1]).$([int]$Matches[2])"
          } elseif ($version -match '^\d+\.\d+$') {
            $version = "$version.0"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?(?:\+[0-9A-Za-z\.-]+)?$') {
            throw "Invalid version: $version"
          }

          if (-not $tag) {
            $tag = "v$version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"
          Write-Host "Release tag: $tag"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download Go modules
        run: go mod download

      - name: Sync Wails3 product version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $buildConfigPath = "build/config.yml"
          $buildConfigText = Get-Content -LiteralPath $buildConfigPath -Raw
          $pattern = '(?m)^(\s{2}version:\s*["'']?)([^"''\r\n]+)(["'']?)\s*$'
          $match = [regex]::Match($buildConfigText, $pattern)
          if (-not $match.Success) {
            throw "Cannot resolve info.version from build/config.yml"
          }
          $oldVersion = [string]$match.Groups[2].Value
          $updatedText = [regex]::Replace(
            $buildConfigText,
            $pattern,
            "`${1}$env:VERSION`${3}",
            1
          )
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $buildConfigPath).Path, $updatedText, $utf8NoBom)
          Write-Host "build/config.yml info.version: $oldVersion -> $env:VERSION"

      - name: Build Windows app
        env:
          GOPROXY: https://proxy.golang.org,direct
          TRACE_BROWSER_VERSION: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: wails3 build

      - name: Verify runtime binaries
        run: |
          $manifest = Get-Content -LiteralPath "publish/runtime-manifest.json" -Raw | ConvertFrom-Json
          $entries = @($manifest.files | Where-Object { $_.targets -contains "windows-amd64" })
          if ($entries.Count -eq 0) {
            throw "No windows-amd64 runtime entries found in publish/runtime-manifest.json"
          }

          foreach ($entry in $entries) {
            $path = [string]$entry.path
            $expected = ([string]$entry.sha256).ToLowerInvariant()
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing runtime file: $path"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Runtime hash mismatch: $path expected=$expected actual=$actual"
            }
          }

      - name: Create staging directory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $staging = Join-Path $PWD "publish/staging"
          $output = Join-Path $PWD "publish/output"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $exe = "build/bin/trace-browser.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Missing built executable: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $staging "trace-browser.exe") -Force

          Copy-Item -LiteralPath "publish/config.init.yaml" -Destination (Join-Path $staging "config.yaml") -Force

          New-Item -ItemType Directory -Path (Join-Path $staging "bin") -Force | Out-Null
          Copy-Item -LiteralPath "bin/xray.exe" -Destination (Join-Path $staging "bin/xray.exe") -Force
          Copy-Item -LiteralPath "bin/sing-box.exe" -Destination (Join-Path $staging "bin/sing-box.exe") -Force

          if (Test-Path -LiteralPath "chrome" -PathType Container) {
            New-Item -ItemType Directory -Path (Join-Path $staging "chrome") -Force | Out-Null
            Copy-Item -Path "chrome/*" -Destination (Join-Path $staging "chrome") -Recurse -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Path (Join-Path $staging "data") -Force | Out-Null
          Write-Host "Staging created: $staging"

      - name: Build portable package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $portable = "publish/output/TraceBrowser-Portable-$env:VERSION-win-x64.zip"
          Remove-Item -LiteralPath $portable -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "publish/staging/*" -DestinationPath $portable -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "Portable package was not created: $portable"
          }
          Write-Host "Portable package: $portable"

      - name: Build Wails self-update package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $selfUpdateRoot = Join-Path $env:RUNNER_TEMP "trace-browser-selfupdate"
          Remove-Item -LiteralPath $selfUpdateRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $selfUpdateRoot -Force | Out-Null
          Copy-Item -LiteralPath "build/bin/trace-browser.exe" -Destination (Join-Path $selfUpdateRoot "trace-browser.exe") -Force

          $selfUpdate = "publish/output/TraceBrowser-SelfUpdate-$env:VERSION-windows-amd64.zip"
          Remove-Item -LiteralPath $selfUpdate -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$selfUpdateRoot/*" -DestinationPath $selfUpdate -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $selfUpdate -PathType Leaf)) {
            throw "Wails self-update package was not created: $selfUpdate"
          }
          Write-Host "Wails self-update package: $selfUpdate"

      - name: Build installer package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $makensis = (Get-Command makensis.exe).Source
          $staging = (Resolve-Path "publish/staging").Path
          & $makensis /NOCONFIG "/DVERSION=$env:VERSION" "/DSTAGINGDIR=$staging" "publish/installer.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

          $installer = "publish/output/TraceBrowser-Setup-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer package was not created: $installer"
          }
          Write-Host "Installer package: $installer"

      - name: Generate Wails update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
        run: |
          $releaseRepository = $env:PUBLIC_RELEASE_REPOSITORY.Trim()
          if (-not $releaseRepository) {
            $releaseRepository = "${{ github.repository }}"
          }

          $selfUpdate = Get-ChildItem -LiteralPath "publish/output" -Filter "TraceBrowser-SelfUpdate-*.zip" | Select-Object -First 1
          if (-not $selfUpdate) {
            throw "Missing Wails self-update package for update manifest"
          }

          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $selfUpdate.FullName).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/$releaseRepository/releases/download/$env:RELEASE_TAG/$($selfUpdate.Name)"
          $manifest = [ordered]@{
            version = $env:VERSION
            release_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-amd64" = [ordered]@{
                url = $downloadUrl
                name = $selfUpdate.Name
                size = $selfUpdate.Length
                checksum = $checksum
              }
            }
          }
          $manifestPath = "publish/output/update.json"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD.Path $manifestPath),
            ($manifest | ConvertTo-Json -Depth 10) + "`n",
            $utf8NoBom
          )
          Write-Host "Update manifest: $manifestPath"
          Write-Host "Update URL: $downloadUrl"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: trace-browser-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            publish/output/TraceBrowser-Setup-*.exe
            publish/output/TraceBrowser-Portable-*-win-x64.zip
            publish/output/TraceBrowser-SelfUpdate-*-windows-amd64.zip
            publish/output/update.json

      - name: Checkout public release repository
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          path: public-release-repo

      - name: Create public release tag commit
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY != '' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $sourceCommitMessage = (git -C $env:GITHUB_WORKSPACE log -1 --format=%B | Out-String).Trim()
          if (-not $sourceCommitMessage) {
            $sourceCommitMessage = "Release $env:RELEASE_TAG"
          }

          $repo = Join-Path $env:GITHUB_WORKSPACE "public-release-repo"
          Set-Location -LiteralPath $repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $messageFile = Join-Path $env:RUNNER_TEMP "public-release-commit-message.txt"
          Set-Content -LiteralPath $messageFile -Value $sourceCommitMessage -Encoding UTF8

          git commit --allow-empty --file $messageFile
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create public release commit"
          }

          $branch = git branch --show-current
          if (-not $branch) {
            $remoteHead = git symbolic-ref --short refs/remotes/origin/HEAD
            $branch = $remoteHead -replace '^origin/', ''
          }

          git tag -f $env:RELEASE_TAG
          git push origin "HEAD:$branch"
          git push origin "refs/tags/$env:RELEASE_TAG" --force

      - name: Upload packages to current repository release
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trace Browser ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            publish/output/TraceBrowser-Setup-*.exe
            publish/output/TraceBrowser-Portable-*-win-x64.zip
            publish/output/TraceBrowser-SelfUpdate-*-windows-amd64.zip
            publish/output/update.json

      - name: Upload packages to public release repository
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trace Browser ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            publish/output/TraceBrowser-Setup-*.exe
            publish/output/TraceBrowser-Portable-*-win-x64.zip
            publish/output/TraceBrowser-SelfUpdate-*-windows-amd64.zip
            publish/output/update.json
