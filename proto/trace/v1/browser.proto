syntax = "proto3";

package trace.v1;

option go_package = "ant-chrome/proto/trace/v1;tracev1";

message BrowserProfile {
  string profile_id = 1;
  string profile_name = 2;
  string user_data_dir = 3;
  string core_id = 4;
  repeated string fingerprint_args = 5;
  string proxy_id = 6;
  string proxy_config = 7;
  string proxy_bind_source_id = 8;
  string proxy_bind_source_url = 9;
  string proxy_bind_name = 10;
  string proxy_bind_updated_at = 11;
  bool auto_proxy_switch_enabled = 12;
  string auto_proxy_switch_group_name = 13;
  string auto_proxy_switch_mode = 14;
  int32 auto_proxy_switch_interval_m = 15;
  string auto_proxy_switch_last_proxy_id = 16;
  repeated string launch_args = 17;
  repeated string tags = 18;
  repeated string keywords = 19;
  string group_id = 20;
  string launch_code = 21;
  bool running = 22;
  int32 debug_port = 23;
  bool debug_ready = 24;
  int32 pid = 25;
  string runtime_warning = 26;
  string last_error = 27;
  string created_at = 28;
  string updated_at = 29;
  string last_start_at = 30;
  string last_stop_at = 31;
}

message BrowserProfileListRequest {
  string tag = 1;
}

message BrowserProfileListResponse {
  repeated BrowserProfile profiles = 1;
}

message BrowserProfileInput {
  string profile_name = 1;
  string user_data_dir = 2;
  string core_id = 3;
  repeated string fingerprint_args = 4;
  string proxy_id = 5;
  string proxy_config = 6;
  bool auto_proxy_switch_enabled = 7;
  string auto_proxy_switch_group_name = 8;
  string auto_proxy_switch_mode = 9;
  int32 auto_proxy_switch_interval_m = 10;
  repeated string launch_args = 11;
  repeated string tags = 12;
  repeated string keywords = 13;
  string group_id = 14;
}

message BrowserProfileCreateRequest {
  BrowserProfileInput profile = 1;
}

message BrowserProfileUpdateRequest {
  string profile_id = 1;
  BrowserProfileInput profile = 2;
}

message BrowserProfileDeleteRequest {
  string profile_id = 1;
}

message BrowserProfileDeleteResponse {
  bool deleted = 1;
}

message BrowserProfileCopyRequest {
  string profile_id = 1;
  string new_name = 2;
}

message BrowserProfileResponse {
  BrowserProfile profile = 1;
}

message BrowserInstanceProfileRequest {
  string profile_id = 1;
}

message BrowserInstanceStartByCodeRequest {
  string code = 1;
}

message BrowserTagListResponse {
  repeated string tags = 1;
}

message BrowserProfileSetKeywordsRequest {
  string profile_id = 1;
  repeated string keywords = 2;
}

message BrowserProfileBatchSetTagsRequest {
  repeated string profile_ids = 1;
  repeated string tags = 2;
  bool replace = 3;
}

message BrowserProfileBatchRemoveTagsRequest {
  repeated string profile_ids = 1;
  repeated string tags = 2;
}

message BrowserTagRenameRequest {
  string old_name = 1;
  string new_name = 2;
}

message BrowserActionResponse {
  bool ok = 1;
}

message BrowserGroup {
  string group_id = 1;
  string group_name = 2;
  string parent_id = 3;
  int32 sort_order = 4;
  string created_at = 5;
  string updated_at = 6;
  int32 instance_count = 7;
}

message BrowserGroupInput {
  string group_name = 1;
  string parent_id = 2;
  int32 sort_order = 3;
}

message BrowserGroupListResponse {
  repeated BrowserGroup groups = 1;
}

message BrowserGroupCreateRequest {
  BrowserGroupInput group = 1;
}

message BrowserGroupUpdateRequest {
  string group_id = 1;
  BrowserGroupInput group = 2;
}

message BrowserGroupDeleteRequest {
  string group_id = 1;
}

message BrowserGroupMoveProfilesRequest {
  repeated string profile_ids = 1;
  string group_id = 2;
}

message BrowserGroupResponse {
  BrowserGroup group = 1;
}

message BrowserTab {
  string tab_id = 1;
  string title = 2;
  string url = 3;
  bool active = 4;
}

message BrowserInstanceOpenURLRequest {
  string profile_id = 1;
  string target_url = 2;
}

message BrowserTabListResponse {
  repeated BrowserTab tabs = 1;
}

message BrowserProfileCodeRequest {
  string profile_id = 1;
}

message BrowserProfileSetCodeRequest {
  string profile_id = 1;
  string code = 2;
}

message BrowserProfileCodeResponse {
  string code = 1;
}

message BrowserLaunchServerAPIAuth {
  bool requested = 1;
  bool configured = 2;
  bool enabled = 3;
  string header = 4;
}

message BrowserLaunchServerInfoResponse {
  string host = 1;
  int32 port = 2;
  int32 preferred_port = 3;
  string base_url = 4;
  string cdp_url = 5;
  int32 active_debug_port = 6;
  bool ready = 7;
  BrowserLaunchServerAPIAuth api_auth = 8;
}

message BrowserSettings {
  string user_data_root = 1;
  repeated string default_fingerprint_args = 2;
  repeated string default_launch_args = 3;
  string default_proxy = 4;
  int32 start_ready_timeout_ms = 5;
  int32 start_stable_window_ms = 6;
}

message BrowserSettingsResponse {
  BrowserSettings settings = 1;
}

message BrowserSettingsSaveRequest {
  BrowserSettings settings = 1;
}

message BrowserBookmark {
  string name = 1;
  string url = 2;
}

message BrowserBookmarkListResponse {
  repeated BrowserBookmark items = 1;
}

message BrowserBookmarkSaveRequest {
  repeated BrowserBookmark items = 1;
}

message BrowserStartURL {
  string name = 1;
  string url = 2;
}

message BrowserStartURLListResponse {
  repeated BrowserStartURL items = 1;
}

message BrowserStartURLSaveRequest {
  repeated BrowserStartURL items = 1;
}

message BrowserDefaultContentRule {
  string rule_id = 1;
  string scope = 2;
  string target_id = 3;
  string target_name = 4;
  repeated BrowserStartURL start_urls = 5;
  repeated BrowserBookmark bookmarks = 6;
  bool enabled = 7;
  bool apply_to_childs = 8;
  bool include_global_defaults = 9;
  bool has_include_global_defaults = 10;
}

message BrowserDefaultContentRuleListResponse {
  repeated BrowserDefaultContentRule rules = 1;
}

message BrowserDefaultContentRuleSaveRequest {
  repeated BrowserDefaultContentRule rules = 1;
}

message BrowserSnapshotInfo {
  string snapshot_id = 1;
  string profile_id = 2;
  string name = 3;
  int64 size_mb_milli = 4;
  string created_at = 5;
}

message BrowserSnapshotProfileRequest {
  string profile_id = 1;
}

message BrowserSnapshotCreateRequest {
  string profile_id = 1;
  string name = 2;
}

message BrowserSnapshotActionRequest {
  string profile_id = 1;
  string snapshot_id = 2;
}

message BrowserSnapshotListResponse {
  repeated BrowserSnapshotInfo snapshots = 1;
}

message BrowserSnapshotResponse {
  BrowserSnapshotInfo snapshot = 1;
}

message BrowserCookieInfo {
  string name = 1;
  string value = 2;
  string domain = 3;
  string path = 4;
  int64 expires = 5;
  bool http_only = 6;
  bool secure = 7;
  string same_site = 8;
}

message BrowserCookieProfileRequest {
  string profile_id = 1;
}

message BrowserCookieImportRequest {
  string profile_id = 1;
  string content = 2;
}

message BrowserCookieListResponse {
  repeated BrowserCookieInfo cookies = 1;
}

message BrowserCookieExportResponse {
  string content = 1;
}

message BrowserCookieImportResult {
  int32 imported = 1;
  int32 skipped = 2;
}

message BrowserUserDataDirOpenRequest {
  string user_data_dir = 1;
}

message BrowserProfileUserDataDirOpenRequest {
  string profile_id = 1;
}

message BrowserExtension {
  string extension_id = 1;
  string name = 2;
  string version = 3;
  int32 manifest_version = 4;
  string description = 5;
  string source_type = 6;
  string source_url = 7;
  string install_dir = 8;
  string package_path = 9;
  string manifest_json = 10;
  int32 bound_count = 11;
  bool auto_bind_enabled = 12;
  string auto_bind_mode = 13;
  string created_at = 14;
  string updated_at = 15;
}

message BrowserExtensionBinding {
  int64 id = 1;
  string profile_id = 2;
  string profile_name = 3;
  string extension_id = 4;
  string extension_name = 5;
  string extension_version = 6;
  string mode = 7;
  bool enabled = 8;
  string exclusive_dir = 9;
  string created_at = 10;
  string updated_at = 11;
}

message BrowserExtensionIDRequest {
  string extension_id = 1;
}

message BrowserExtensionProfileRequest {
  string profile_id = 1;
}

message BrowserExtensionListResponse {
  repeated BrowserExtension extensions = 1;
}

message BrowserExtensionResponse {
  BrowserExtension extension = 1;
}

message BrowserExtensionChoosePathResponse {
  bool cancelled = 1;
  string path = 2;
}

message BrowserExtensionImportRequest {
  string path = 1;
  string mode = 2;
  string existing = 3;
}

message BrowserExtensionImportResult {
  bool cancelled = 1;
  bool duplicate = 2;
  string message = 3;
  BrowserExtension existing = 4;
  BrowserExtension extension = 5;
}

message BrowserExtensionAssignRequest {
  string extension_id = 1;
  repeated string profile_ids = 2;
  string mode = 3;
  bool enabled = 4;
}

message BrowserExtensionAutoBindRequest {
  string extension_id = 1;
  bool enabled = 2;
  string mode = 3;
}

message BrowserExtensionUnassignRequest {
  string extension_id = 1;
  repeated string profile_ids = 2;
}

message BrowserExtensionBindingListResponse {
  repeated BrowserExtensionBinding bindings = 1;
}
