syntax = "proto3";

package trace.v1;

option go_package = "ant-chrome/proto/trace/v1;tracev1";

message RpcEnvelope {
  string request_id = 1;
  string method = 2;
  bytes payload = 3;
  int32 schema_version = 4;
  int64 timestamp_ms = 5;
}

message RpcError {
  string code = 1;
  string message = 2;
  string details = 3;
}

message RpcResponse {
  string request_id = 1;
  bytes payload = 2;
  RpcError error = 3;
}

message RpcEvent {
  string event_id = 1;
  string event_name = 2;
  bytes payload = 3;
  int64 timestamp_ms = 4;
}
