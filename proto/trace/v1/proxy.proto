syntax = "proto3";

package trace.v1;

option go_package = "ant-chrome/proto/trace/v1;tracev1";

message BrowserProxy {
  string proxy_id = 1;
  string proxy_name = 2;
  string proxy_config = 3;
  string dns_servers = 4;
  string group_name = 5;
  int32 sort_order = 6;
  string source_id = 7;
  string source_url = 8;
  string source_name_prefix = 9;
  string source_filter_json = 10;
  bool source_auto_refresh = 11;
  int32 source_refresh_interval_m = 12;
  string source_last_refresh_at = 13;
  int64 last_latency_ms = 14;
  bool last_test_ok = 15;
  string last_tested_at = 16;
  string last_ip_health_json = 17;
}

message BrowserProxyListRequest {
  string group_name = 1;
}

message BrowserProxyListResponse {
  repeated BrowserProxy proxies = 1;
}

message BrowserProxyGroupListResponse {
  repeated string groups = 1;
}

message BrowserProxySaveRequest {
  repeated BrowserProxy proxies = 1;
}

message BrowserProxyFetchClashByURLRequest {
  string url = 1;
}

message BrowserProxyFetchClashByURLResponse {
  string url = 1;
  string content = 2;
  int32 proxy_count = 3;
  string dns_servers = 4;
  string suggested_group = 5;
}

message BrowserProxyValidateConfigRequest {
  string proxy_config = 1;
  string proxy_id = 2;
}

message BrowserProxyValidateConfigResponse {
  bool supported = 1;
  string error_msg = 2;
}

message BrowserProxyTestRequest {
  string proxy_id = 1;
  string proxy_config = 2;
}

message BrowserProxyIDListRequest {
  repeated string proxy_ids = 1;
  int32 concurrency = 2;
}

message BrowserProxyPreviewTestInput {
  string proxy_id = 1;
  string proxy_config = 2;
}

message BrowserProxyPreviewTestRequest {
  repeated BrowserProxyPreviewTestInput items = 1;
  int32 concurrency = 2;
}

message BrowserProxyTestResult {
  string proxy_id = 1;
  bool ok = 2;
  int64 latency_ms = 3;
  string error = 4;
}

message BrowserProxyTestResultListResponse {
  repeated BrowserProxyTestResult results = 1;
}

message BrowserProxyIPHealthResult {
  string proxy_id = 1;
  bool ok = 2;
  string source = 3;
  string error = 4;
  string ip = 5;
  int64 fraud_score = 6;
  bool is_residential = 7;
  bool is_broadcast = 8;
  string country = 9;
  string region = 10;
  string city = 11;
  string as_organization = 12;
  string raw_data_json = 13;
  string updated_at = 14;
}

message BrowserProxyIPHealthResultListResponse {
  repeated BrowserProxyIPHealthResult results = 1;
}
