syntax = "proto3";

package trace.v1;

option go_package = "ant-chrome/proto/trace/v1;tracev1";

message BrowserCore {
  string core_id = 1;
  string core_name = 2;
  string core_path = 3;
  bool is_default = 4;
}

message BrowserCoreListResponse {
  repeated BrowserCore cores = 1;
}

message BrowserCoreSaveRequest {
  BrowserCore core = 1;
}

message BrowserCoreIDRequest {
  string core_id = 1;
}

message BrowserCorePathRequest {
  string core_path = 1;
}

message BrowserCoreValidateResponse {
  bool valid = 1;
  string message = 2;
}

message BrowserCoreExtendedInfo {
  string core_id = 1;
  string chrome_version = 2;
  int32 instance_count = 3;
}

message BrowserCoreExtendedInfoResponse {
  repeated BrowserCoreExtendedInfo items = 1;
}

message BrowserCoreDownloadRequest {
  string core_name = 1;
  string url = 2;
  string proxy_config = 3;
}

message BrowserCoreDownloadProgress {
  string phase = 1;
  int32 progress = 2;
  string message = 3;
}
